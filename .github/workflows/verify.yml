name: verify

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: observatory_test
          MYSQL_USER: observatory
          MYSQL_PASSWORD: local-only-not-for-deployment
          MYSQL_ROOT_PASSWORD: root-for-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-for-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -s scripts/maven-settings.xml verify
        env:
          TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/observatory_test?connectionTimeZone=UTC&characterEncoding=UTF-8
          TEST_DATABASE_USER: observatory
          TEST_DATABASE_PASSWORD: local-only-not-for-deployment
