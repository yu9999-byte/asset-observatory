services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-observatory}
      MYSQL_USER: ${MYSQL_USER:-observatory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - observatory_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_BIND: 0.0.0.0
      APP_EXTERNAL: "true"
      APP_SECURE_COOKIE: "true"
      APP_USER: ${APP_USER:?APP_USER must be set}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-observatory}?connectionTimeZone=UTC&characterEncoding=UTF-8
      DATABASE_USER: ${MYSQL_USER:-observatory}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      APP_SOURCES_ENABLED: "false"
      APP_KRAKEN_APPROVED: "false"
      APP_BLOCKSCOUT_LEGACY_APPROVED: "false"

volumes:
  observatory_mysql:
