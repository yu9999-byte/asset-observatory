ap does not necessarily mean price is rising.\",\"evidenceQ\":\"Look for supporting evidence\",\"evidenceA\":\"Relative volume compares the last completed day with the mean of the preceding 20 candles. MA direction compares the focus average with its value five candles ago. 1.5× means 50% more volume. It is context, not a probability of a breakout.\",\"methodTitle\":\"Methodology \u0026 data\",\"methodBody\":\"Every metric is calculated from CoinPaprika's daily average USD prices: one value per UTC day, the mean of that day's prices. Only completed days count; today is left out until 00:00 UTC. SMA uses N daily values; EMA uses α = 2/(N+1), seeded with an N-day SMA. Market cap is the last daily average × circulating supply, not fully diluted valuation. Preset market-cap ranges include the lower boundary and exclude the upper boundary; custom ranges include both. Price change compares the last two daily averages. MA direction uses a ±0.05% band over five candles to separate rising, falling and nearly flat averages. Volume / market cap = 24h USD volume ÷ market cap × 100; high turnover can also reflect speculative or inflated activity. Stablecoins are excluded. These are volume filters, not a measure of order-book liquidity. A coin without enough history for an average shows no value for it rather than a guess.\"},\"data\":{\"eyebrow\":\"Data \u0026 methodology\",\"heading\":\"Understand the screener\",\"lede\":\"Moving Average Radar compares a coin's last daily average price with its 10, 20, 50 and 200-day simple or exponential moving averages. Choose a focus average, then narrow the screen by distance, volume and market cap.\",\"q1\":\"Is MA200 the 200-day average?\",\"a1\":\"Yes. Every period is one daily candle, so MA200 covers the last 200 completed UTC days. The 24h metrics come from the latest daily candle.\",\"q2\":\"Does approaching an MA predict a breakout?\",\"a2\":\"No. It identifies a price near an average with a shrinking absolute gap. The average can move too. Price may cross, bounce or move sideways; relative volume provides context, not a probability.\",\"q3\":\"How fresh is this data?\",\"a3\":\"The screen is rebuilt once a day after 00:00 UTC. This snapshot uses the days completed by {time}.\",\"q4\":\"Can software read the same values?\",\"a4\":\"Yes. The JSON snapshot carries every coin's SMA and EMA readings with the snapshot time. Read the formulas above before comparing values.\",\"linksLabel\":\"Machine-readable resources\",\"json\":\"Snapshot · JSON\"}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L14\"}]\n14:["])</script><script>self.__next_f.push([1,"\"$\",\"$L15\",null,{\"children\":[\"$\",\"$L16\",null,{\"delayDuration\":300,\"children\":[\"$\",\"$L17\",null,{\"initialCurrency\":\"USD\",\"children\":[\"$\",\"$L18\",null,{\"children\":[\"$\",\"$L19\",null,{\"children\":[\"$\",\"$L1a\",null,{\"children\":[[\"$\",\"$L1b\",null,{\"variant\":\"market\"}],[\"$\",\"main\",null,{\"id\":\"main\",\"tabIndex\":-1,\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$1c\",\"errorStyles\":[],\"errorScripts\":[[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/cce959e9c459cc47.js\",\"async\":true}]],\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[\"$\",\"$L1d\",null,{}],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}],\"$L1e\",[\"$\",\"$L1f\",null,{}],[\"$\",\"$L20\",null,{}],[\"$\",\"$L21\",null,{}],[\"$\",\"$L22\",null,{}]]}]}]}]}]}]}]\n9:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"Page not found | CoinPaprika\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Track cryptocurrency prices, market capitalizations, and trading volumes in real time on CoinPaprika.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"msapplication-TileColor\",\"content\":\
